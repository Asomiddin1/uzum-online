<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Online - Onlayn Do'kon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>Uzum Market</h2>
            </div>
            
            <!-- Search Bar -->
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Mahsulotlarni qidirish..." onkeyup="searchProducts()">
                <button class="search-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>

            <div class="nav-actions">
                <!-- Cart Button -->
                <button class="nav-icon-btn" onclick="toggleCart()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>

                <!-- User Button -->
                <button class="login-btn" id="navUserBtn" onclick="handleNavUserClick()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Kirish</span>
                </button>
            </div>
        </div>

        <!-- Categories Bar -->
        <div class="nav-categories">
            <div class="nav-container">
                <button class="category-btn active" onclick="filterByCategory('all')">Barchasi</button>
                <button class="category-btn" onclick="filterByCategory('Elektronika')">Elektronika</button>
                <button class="category-btn" onclick="filterByCategory('Kiyim')">Kiyim</button>
                <button class="category-btn" onclick="filterByCategory('Uy-joy')">Uy-joy</button>
                <button class="category-btn" onclick="filterByCategory('Sport')">Sport</button>
            </div>
        </div>
    </nav>

    <!-- Hero/Reklama Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Xush kelibsiz!</h1>
            <p class="hero-subtitle">Eng sifatli mahsulotlar eng yaxshi narxlarda</p>
        </div>
    </section>

    <!-- Mahsulotlar bo'limi -->
    <div class="container">
        <div class="section-title">
            <h2>Bizning Mahsulotlar</h2>
            <p>Tanlangan eng yangi mahsulotlar</p>
        </div>

        <div class="items-grid" id="itemsGrid">
            <!-- JavaScript orqali to'ldiriladi -->
        </div>

        <div class="pagination">
            <button id="prevBtn" onclick="prevPage()">⬅️ Oldingi</button>
            <span id="pageInfo"></span>
            <button id="nextBtn" onclick="nextPage()">Keyingi ➡️</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLoginModal()">&times;</span>
            <h2>Hisobga Kirish</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email yoki Telefon</label>
                    <input type="text" id="email" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Parol</label>
                    <input type="password" id="password" placeholder="Parolingizni kiriting" required>
                </div>
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox"> Eslab qol
                    </label>
                    <a href="#" class="forgot-link">Parolni unutdingizmi?</a>
                </div>
                <button type="submit" class="submit-btn">Kirish</button>
                <p class="register-link">Hisobingiz yo'qmi? <a href="#" onclick="switchToRegister(event)">Ro'yxatdan o'tish</a></p>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeRegisterModal()">&times;</span>
            <h2>Ro'yxatdan O'tish</h2>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regName">Ism va Familiya</label>
                    <input type="text" id="regName" placeholder="Ismingizni kiriting" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label for="regPhone">Telefon raqam</label>
                    <input type="tel" id="regPhone" placeholder="+998 90 123 45 67" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Parol</label>
                    <input type="password" id="regPassword" placeholder="Kamida 6 ta belgi" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Parolni tasdiqlash</label>
                    <input type="password" id="regConfirmPassword" placeholder="Parolni qayta kiriting" minlength="6" required>
                </div>
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" required> Shartlar va qoidalarga roziman
                    </label>
                </div>
                <button type="submit" class="submit-btn">Ro'yxatdan o'tish</button>
                <p class="register-link">Hisobingiz bormi? <a href="#" onclick="switchToLogin(event)">Kirish</a></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
